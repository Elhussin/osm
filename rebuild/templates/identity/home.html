<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>حساب الشركة</title></head><body><main><h1>{{ request.company.name }}</h1><p>{{ request.user.username }}</p><h2>الفروع المتاحة</h2><ul>{% for branch in branches %}<li>{{ branch.name }}<form action="{% url 'switch-branch' %}" method="post">{% csrf_token %}<input type="hidden" name="branch_id" value="{{ branch.pk }}"><button type="submit">اختيار الفرع</button></form></li>{% empty %}<li>لا توجد فروع مخولة لعمليات البيع.</li>{% endfor %}</ul><form action="{% url 'logout' %}" method="post">{% csrf_token %}<button type="submit">خروج</button></form></main></body></html>
