{% if page_obj.paginator.num_pages > 1 %}<nav class="pagination" aria-label="ترقيم الصفحات"><span>الصفحة {{ page_obj.number }} من {{ page_obj.paginator.num_pages }}</span><div>{% if page_obj.has_previous %}<a class="button button-secondary" href="?{{ query_params }}&amp;page={{ page_obj.previous_page_number }}" hx-get="?{{ query_params }}&amp;page={{ page_obj.previous_page_number }}" hx-target="#listing" hx-select="#listing" hx-swap="outerHTML" hx-push-url="true">السابق</a>{% endif %}{% if page_obj.has_next %}<a class="button button-secondary" href="?{{ query_params }}&amp;page={{ page_obj.next_page_number }}" hx-get="?{{ query_params }}&amp;page={{ page_obj.next_page_number }}" hx-target="#listing" hx-select="#listing" hx-swap="outerHTML" hx-push-url="true">التالي</a>{% endif %}</div></nav>{% endif %}
