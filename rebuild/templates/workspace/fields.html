{% if form.non_field_errors %}<div class="notice notice-error" role="alert" tabindex="-1">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}{% if field.is_hidden %}{{ field }}{% else %}<div class="field {% if field.errors %}field-invalid{% endif %}"><label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required" aria-hidden="true">*</span>{% endif %}</label>{{ field }}{% if field.help_text %}<p class="field-hint" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}{% if field.errors %}<div class="field-error" id="{{ field.auto_id }}_error" role="alert">{{ field.errors }}</div>{% endif %}</div>{% endif %}{% endfor %}
